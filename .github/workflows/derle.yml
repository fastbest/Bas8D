name: APK Derle
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APK derle
        run: gradle assembleDebug --no-daemon
      - name: APK adini ayarla
        run: cp app/build/outputs/apk/debug/app-debug.apk Bas8D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bas8D-apk
          path: Bas8D.apk
      - name: Surum yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son --yes --cleanup-tag || true
          sleep 3
          gh release create son Bas8D.apk --title "Bas8D Muzik" --notes "En son derlenen APK" --latest
